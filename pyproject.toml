[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gdpr-erasure-kit"
dynamic = ["version"]
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
gdpr-kit = "gdpr_erasure_kit.cli:main"

[tool.setuptools.dynamic]
version = {attr = "gdpr_erasure_kit.__version__"}

[tool.setuptools.packages.find]
include = ["gdpr_erasure_kit*"]

[tool.setuptools.package-data]
gdpr_erasure_kit = ["templates/*/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
